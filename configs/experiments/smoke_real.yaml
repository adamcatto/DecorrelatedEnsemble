id: smoke_real
role: development
seeds:
- 11
outer_folds: 2
inner_folds: 2
candidates:
  B: 12
  feature_fractions:
  - 0.1
  depths:
  - 3
  min_samples_leaf:
  - 5
certification:
  bootstrap_reps: 100
  alpha: 0.05
  auc_threshold: 0.51
  regression_threshold: 0.01
datasets:
- id: wine
  source: sklearn
  name: wine
methods:
- id: random_subspace
  selector: random
  certified: false
  K: 4
  charge_search: false
- id: certified_random
  selector: random
  certified: true
  K: 4
- id: top_quality
  selector: top_quality
  certified: true
  K: 4
- id: top_no_cert
  selector: top_quality
  certified: false
  K: 4
- id: abs_correlation
  selector: abs_correlation
  certified: true
  K: 4
  max_swaps: 3
- id: signed_correlation
  selector: signed_correlation
  certified: true
  K: 4
  max_swaps: 3
- id: minimax
  selector: minimax
  certified: true
  K: 4
  max_swaps: 3
- id: quality_diversity
  selector: quality_diversity
  certified: true
  K: 4
  lambda: 0.1
  max_swaps: 3
- id: prediction_correlation
  selector: prediction_correlation
  certified: true
  K: 4
  max_swaps: 3
- id: coerror_greedy
  selector: coerror
  certified: true
  K: 4
- id: direct_squared
  selector: direct_squared
  certified: true
  K: 4
- id: coerror
  selector: coerror
  certified: true
  K: 4
  max_swaps: 5
- id: coerror_no_cert
  selector: coerror
  certified: false
  K: 4
  max_swaps: 5
- id: covariance_only
  selector: covariance_only
  certified: true
  K: 4
  max_swaps: 5
- id: shrinkage
  selector: shrinkage_coerror
  certified: true
  K: 4
  shrinkage: 0.5
  max_swaps: 5
- id: caruana
  selector: caruana
  certified: false
  K: 4
- id: direct_auroc
  selector: direct_auroc
  certified: false
  K: 4
  tasks:
  - binary
- id: coerror_no_cert_affine
  selector: coerror
  K: 4
  certified: false
  max_swaps: 5
  affine_calibration: true
  tasks:
  - regression
- id: affine_profiled
  selector: affine_profiled
  K: 4
  certified: false
  max_swaps: 5
  affine_calibration: true
  tasks:
  - regression
baselines:
- id: rf_shallow
  family: random_forest
  parameters:
    n_estimators: 4
    max_depth: 3
    min_samples_leaf: 5
- id: et_shallow
  family: extra_trees
  parameters:
    n_estimators: 4
    max_depth: 3
    min_samples_leaf: 5
- id: random_patches
  family: random_patches
  parameters:
    n_estimators: 4
    max_depth: 3
    min_samples_leaf: 5
    feature_fraction: 0.1
    row_fraction: 0.5
- id: random_forest
  family: random_forest
  parameters:
    n_estimators: 4
- id: extra_trees
  family: extra_trees
  parameters:
    n_estimators: 4
- id: xgboost
  family: xgboost
  parameters:
    n_estimators: 4
    max_depth: 4
    learning_rate: 0.05
- id: lightgbm
  family: lightgbm
  parameters:
    n_estimators: 4
    num_leaves: 15
    learning_rate: 0.05
- id: catboost
  family: catboost
  parameters:
    iterations: 4
    depth: 4
    learning_rate: 0.05
- id: linear
  family: linear
  parameters: {}
hypothesis: At fixed B=100 and K=8, co-error selection adds value beyond quality on
  real development tasks; increasing feature fraction from .1 to .5 tests the representation
  restriction. No task-population or tuned/resource-matched superiority claim.

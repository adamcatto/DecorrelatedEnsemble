[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decorrelated-ensemble"
version = "0.1.0"
description = "Auditable research on selection of feature-sparse ensembles"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2",
  "pandas>=2.2,<3", "matplotlib>=3.9,<4", "PyYAML>=6,<7",
  "joblib>=1.4,<2", "psutil>=6,<8", "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11"]
boosting = ["xgboost>=3,<4", "lightgbm>=4,<5", "catboost>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/decorrelated_ensemble"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

